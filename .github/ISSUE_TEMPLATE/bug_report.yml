name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what the app did instead of what you expected.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route
      description: Start and destination, if the bug involves a specific trip.
      placeholder: Snoqualmie Pass to North Bend, WA
  - type: dropdown
    id: where
    attributes:
      label: Where were you running it
      options:
        - The live demo on GitHub Pages
        - Locally through a static server
        - Somewhere else
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 18 on macOS 15
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything red in the browser console. Optional but very helpful.
      render: text
